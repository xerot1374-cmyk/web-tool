services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-social_media_tool}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c "select 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: deps
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-social_media_tool}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  vite:
    build:
      context: .
      target: dev
    command: ["sh", "/app/scripts/dev-container-start.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-social_media_tool}?schema=public
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      PORT: ${APP_PORT:-3100}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${APP_PORT:-3100}:${APP_PORT:-3100}"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-web-tool_postgres-data}
  node-modules:
    name: ${NODE_MODULES_VOLUME:-web-tool_node-modules}
  next-cache:
    name: ${NEXT_CACHE_VOLUME:-web-tool_next-cache}
